name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  content: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload artifacts
      uses: action/upload-pages-artifact@v3
      with: 
        path: './'

    deploy: 
      environment:
        name: github-pages
      runs-on: ubuntu-latest
      needs: build 
      steps: 
        - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
